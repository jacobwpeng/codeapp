name: Build Unsigned IPA
on:
  workflow_dispatch:
    inputs:
      app_group:
        description: "App Group ID to replace group.com.thebaselab.code"
        default: "group.3190b95de07ea0c0.1"

jobs:
  build:
    runs-on: macOS-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Download frameworks
        run: ./downloadFrameworks.sh

      - name: Replace App Group
        env:
          APP_GROUP: ${{ inputs.app_group }}
        run: |
          grep -rl 'group\.com\.thebaselab\.code' --include='*.swift' --include='*.entitlements' . \
            | while IFS= read -r f; do sed -i '' "s/group\.com\.thebaselab\.code/${APP_GROUP}/g" "$f"; done
          ! grep -rn 'group\.com\.thebaselab\.code' --include='*.swift' --include='*.entitlements' .

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Code.xcodeproj -scheme "Code App" -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)'

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          ls Payload/*.app/PlugIns || true
          zip -qry Code-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Code-unsigned
          path: Code-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
